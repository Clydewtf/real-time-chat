actions:
  - name: loginUser
    definition:
      kind: synchronous
      handler: http://host.docker.internal:8000/auth/login
      forward_client_headers: true
      headers:
        - name: Content-Type
          value: application/json
    permissions:
      - role: anonymous
  - name: registerUser
    definition:
      kind: synchronous
      handler: http://host.docker.internal:8000/auth/register
      headers:
        - name: Content-Type
          value: application/json
    permissions:
      - role: anonymous
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: LoginResponse
    - name: RegisterResponse
  scalars: []
